name: CI

# Fast pull-request checks.  Runs the lightweight subset: linting, syntax
# validation, fixture smoke harnesses, and one cross-language parity run.
# The full Bats/Pester lifecycle suite lives in ci-full.yml.

# Pinned third-party actions by full commit SHA; the trailing comment records the
# released tag that SHA points at so dependabot can bump the SHA + comment together.
# Policy: never move these tags without updating the SHAs in the same commit.

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to check out (for reusable workflow calls)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          sudo apt-get install -y shellcheck zip

      - name: Install actionlint
        run: curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C /usr/local/bin actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: ShellCheck
        run: |
          # Targeted suppressions instead of a global soft fail: SC1087 is a
          # known false positive here, and the two intentional dead assignments
          # carry inline SC2034 directives. Severity is capped at warning so
          # informational/style findings cannot block.
          shellcheck -e SC1087 -S warning install.sh .agentic/scripts/verify.sh .agentic/scripts/validate-task.sh .agentic/scripts/validate-context.sh

  # ── Bash fast (Ubuntu) ─────────────────────────────────────────────────
  bash-fast:
    name: Bash fast (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bash syntax checks
        run: |
          bash -n install.sh
          bash -n .agentic/scripts/verify.sh
          bash -n .agentic/scripts/validate-task.sh
          bash -n .agentic/scripts/validate-context.sh

      - name: Run offline behavioral evaluations
        run: bash evals/run-evals.sh

      - name: Validate the completed task in handoff mode
        run: bash .agentic/scripts/validate-task.sh --handoff .agentic/tasks/TASK-002-risk-profiles-and-evidence-contracts.md

      - name: Run fixture smoke harness
        run: bash tests/fixtures/run-fixtures.sh .agentic/scripts/verify.sh

  # ── PowerShell fast (Windows) ──────────────────────────────────────────
  powershell-fast:
    name: PowerShell fast (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $err = $false
          foreach ($f in @('install.ps1', '.agentic/scripts/verify.ps1', '.agentic/scripts/validate-task.ps1', '.agentic/scripts/validate-context.ps1')) {
            try { [scriptblock]::Create((Get-Content -Raw -LiteralPath $f)) | Out-Null }
            catch { Write-Error $_.Exception.Message; $err = $true }
          }
          if ($err) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          foreach ($f in @('install.ps1', '.agentic/scripts/verify.ps1', '.agentic/scripts/validate-task.ps1', '.agentic/scripts/validate-context.ps1')) {
            $results += Invoke-ScriptAnalyzer -Path $f -Severity Error
          }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Validate the completed task in handoff mode
        shell: pwsh
        run: pwsh -NoProfile -File .agentic/scripts/validate-task.ps1 -Handoff .agentic/tasks/TASK-002-risk-profiles-and-evidence-contracts.md

      - name: Run fixture smoke harness
        shell: pwsh
        run: pwsh -NoProfile -File tests/fixtures/run-fixtures.ps1 .agentic/scripts/verify.ps1

      - name: Run offline behavioral evaluations
        shell: pwsh
        run: pwsh -NoProfile -File evals/run-evals.ps1

  # ── macOS compatibility ────────────────────────────────────────────────
  macos-compat:
    name: macOS compatibility
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bash 3.2 syntax check
        run: |
          bash -n install.sh
          bash -n .agentic/scripts/verify.sh
          bash -n .agentic/scripts/validate-task.sh
          bash -n .agentic/scripts/validate-context.sh

      - name: Run fixture smoke harness
        run: bash tests/fixtures/run-fixtures.sh .agentic/scripts/verify.sh

      - name: Validate task fixtures against golden expectations (Bash 3.2)
        run: bash tests/parity/run-golden.sh bash .agentic/scripts/validate-task.sh

  # ── Validator parity (single run) ──────────────────────────────────────
  # The parity job invokes pwsh -NoProfile -File per fixture through
  # run-golden.sh / run-parity.sh; that invocation path segfaults (exit 139)
  # on ubuntu-latest, so it runs on ubuntu-22.04 instead. It needs only pwsh,
  # not the Pester/PSScriptAnalyzer modules, which run-parity.sh never imports.
  validator-parity:
    name: Validator parity (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run cross-language parity
        run: |
          bash tests/parity/run-parity.sh

  # ── JSON contract tests (single run) ───────────────────────────────────
  # Runs the machine-readable-contract Pester suite (schemas, JSON modes,
  # events streams) on Linux where its bash-validator legs execute natively.
  # Like validator-parity it invokes pwsh -NoProfile -File per case, so it
  # pins to ubuntu-22.04 to avoid the ubuntu-latest pwsh segfault. The
  # jsonschema version is pinned so schema-validation behavior cannot drift
  # between local runs and CI.
  json-contracts:
    name: JSON contracts (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Pester and pinned jsonschema
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y python3-pip python-is-python3
          # Plain first (Ubuntu 22.04 pip predates PEP 668); fall back to the
          # --break-system-packages flag for images where the marker exists.
          python3 -m pip install jsonschema==4.23.0 || python3 -m pip install --break-system-packages jsonschema==4.23.0
          python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Run JSON contract tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $r = Invoke-Pester -Script 'tests/pester/JsonContracts.Tests.ps1' -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  # ── Aggregator ─────────────────────────────────────────────────────────
  ci-required:
    name: ci-required
    if: always()
    needs:
      - lint
      - bash-fast
      - powershell-fast
      - macos-compat
      - validator-parity
      - json-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results="${{ needs.lint.result }} ${{ needs.bash-fast.result }} ${{ needs.powershell-fast.result }} ${{ needs.macos-compat.result }} ${{ needs.validator-parity.result }} ${{ needs.json-contracts.result }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error One or more required jobs did not succeed: $results"
              exit 1
            fi
          done
