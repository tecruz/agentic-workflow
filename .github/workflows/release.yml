name: Release

# Triggered by pushing a version tag (vX.Y.Z) or manually via workflow_dispatch.
# Validates that .agentic/VERSION, the CHANGELOG section, and the tag all agree;
# runs all CI checks; builds the clean bundle; extracts and tests both archives;
# verifies SHA256SUMS; and uploads release assets from the exact tagged commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.2) — must already exist as a pushed tag'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # 1. Validate that VERSION, CHANGELOG, and the tag all agree; resolve one
  #    immutable commit SHA used by every downstream job.
  # -----------------------------------------------------------------------
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Validate SemVer tag format
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error Invalid release tag: $TAG"
            exit 1
          fi

          # Resolve the exact commit SHA for the tag
          SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null)"
          if [ -z "$SHA" ]; then
            echo "::error Tag $TAG does not exist in the repository"
            exit 1
          fi

          # Verify the remote tag points to this SHA
          REMOTE_SHA="$(git ls-remote --tags origin "$TAG" 2>/dev/null | head -1 | cut -f1)"
          if [ -z "$REMOTE_SHA" ]; then
            echo "::error Tag $TAG not found on remote"
            exit 1
          fi

          # Handle annotated tags (SHA^{commit})
          EXPECTED_SHA="$(git rev-parse "$TAG^{commit}" 2>/dev/null)"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ] && [ "$REMOTE_SHA" != "$SHA" ]; then
            echo "::error Tag $TAG remote SHA ($REMOTE_SHA) does not match resolved SHA ($SHA)"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: VERSION matches tag
        run: |
          FILE_VERSION="$(cat .agentic/VERSION)"
          TAG_VERSION="${{ steps.resolve.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error .agentic/VERSION ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: CHANGELOG has matching section
        run: |
          TAG_VERSION="${{ steps.resolve.outputs.version }}"
          if ! grep -q "## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error CHANGELOG.md has no section [$TAG_VERSION]"
            exit 1
          fi

      - name: Release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error Release $TAG already exists"
            exit 1
          fi

  # -----------------------------------------------------------------------
  # 2. Run the full CI suite on the exact tagged commit.
  # -----------------------------------------------------------------------
  ci:
    name: CI (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: Install bats (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'bats'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz' -OutFile (Join-Path $tmp 'bats.tar.gz')
          tar -xzf (Join-Path $tmp 'bats.tar.gz') -C $tmp
          $dir = (Get-ChildItem -LiteralPath $tmp -Directory | Select-Object -First 1).FullName
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $dir 'bin')

      - name: Install Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run framework checks (Unix)
        if: runner.os != 'Windows'
        run: bash .agentic/scripts/verify.sh

      - name: Run framework checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .agentic/scripts/verify.ps1

      - name: Run Bats suites
        if: runner.os != 'Windows'
        run: bats tests/bats

      - name: Run Bats suites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bats = Get-Command bats -ErrorAction SilentlyContinue
          if ($bats) { bats tests/bats } else { Write-Warning 'bats not found; skipping Bats suites' }

      - name: Run Pester suites
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $r = Invoke-Pester -Script tests/pester -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          foreach ($f in @('install.ps1', '.agentic/scripts/verify.ps1')) {
            $results += Invoke-ScriptAnalyzer -Path $f -Severity Error
          }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Run fixture smoke harness (Unix)
        if: runner.os != 'Windows'
        run: bash tests/fixtures/run-fixtures.sh .agentic/scripts/verify.sh

      - name: Run fixture smoke harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/fixtures/run-fixtures.ps1 .agentic/scripts/verify.ps1

  # -----------------------------------------------------------------------
  # 3. Build the clean bundle, extract + test both archives, verify no
  #    development-only files leaked, and upload release assets.
  # -----------------------------------------------------------------------
  build-and-publish:
    name: Build & publish release
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Resolve version
        run: |
          VERSION="$(cat .agentic/VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Clean previous archives
        run: |
          VERSION="$(cat .agentic/VERSION)"
          rm -f \
            "dist/agentic-workflow-$VERSION.tar.gz" \
            "dist/agentic-workflow-$VERSION.zip" \
            "dist/SHA256SUMS"

      - name: Build bundle
        run: bash scripts/build-bundle.sh

      - name: Verify SHA256SUMS
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: No development-only files in bundle
        run: |
          VERSION="$(cat .agentic/VERSION)"
          BUNDLE="dist/agentic-workflow-$VERSION"
          FAIL=0
          for leak in tests .github docs .agentic/checks.tsv CHANGELOG.md README.md CONTRIBUTING.md SECURITY.md; do
            if [ -e "$BUNDLE/$leak" ]; then
              echo "::error Bundle leaked '$leak'"
              FAIL=1
            fi
          done
          # ADRs should not be in the bundle
          if ls "$BUNDLE"/.agentic/decisions/ADR-* >/dev/null 2>&1; then
            echo "::error Bundle leaked ADR files"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ]

      - name: Extract and test tar.gz
        run: |
          VERSION="$(cat .agentic/VERSION)"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          EXTRACT_DIR="$(mktemp -d)"
          PROJECT="$(mktemp -d)"

          tar -xzf "$DIST_DIR/agentic-workflow-$VERSION.tar.gz" -C "$EXTRACT_DIR"

          cd "$PROJECT"
          bash "$EXTRACT_DIR/agentic-workflow-$VERSION/install.sh" . >/dev/null 2>&1

          # Verify core files
          test -f AGENTS.md
          test -f .agentic/VERSION
          test -f .agentic/checks.tsv
          grep -q "seed" .agentic/install-manifest.tsv

          # Verify verifier is executable
          test -x .agentic/scripts/verify.sh

          # Run the verifier; an empty project should be UNSUPPORTED (exit 3)
          set +e
          ./.agentic/scripts/verify.sh
          rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "::error Expected UNSUPPORTED (3) for empty project, got $rc"
            exit 1
          fi

          # Verify archive checksum
          cd "$DIST_DIR"
          sha256sum -c SHA256SUMS

          rm -rf "$EXTRACT_DIR" "$PROJECT"

      - name: Extract and test zip
        run: |
          VERSION="$(cat .agentic/VERSION)"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          EXTRACT_DIR="$(mktemp -d)"
          PROJECT="$(mktemp -d)"

          unzip -q "$DIST_DIR/agentic-workflow-$VERSION.zip" -d "$EXTRACT_DIR"

          # Detect bundle directory
          BUNDLE="$(find "$EXTRACT_DIR" -name "install.sh" -path "*/agentic-workflow-*/install.sh" -exec dirname {} \; 2>/dev/null | head -1)"
          if [ -z "$BUNDLE" ]; then
            echo "::error Could not locate bundle after zip extraction"
            exit 1
          fi

          cd "$PROJECT"
          bash "$BUNDLE/install.sh" . >/dev/null 2>&1

          test -f AGENTS.md
          test -f .agentic/VERSION
          grep -q "seed" .agentic/install-manifest.tsv

          rm -rf "$EXTRACT_DIR" "$PROJECT"

      - name: Extract changelog section for release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version, stopping before the next ## heading
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > /tmp/release-notes.md
          # Append generated contributor notes
          {
            echo ""
            echo "---"
            echo ""
            echo "### Contributors"
            echo ""
            echo "This release was built from commit ${{ needs.validate.outputs.sha }}."
          } >> /tmp/release-notes.md

      - name: Create or update draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -1 | sed 's/^## //')"

          # Delete any partially failed release (draft or incomplete)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          fi

          # Create a draft release with all assets
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG — $TITLE" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            --draft \
            dist/agentic-workflow-"$VERSION".tar.gz \
            dist/agentic-workflow-"$VERSION".zip \
            dist/SHA256SUMS

          # Verify all assets uploaded correctly
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            | python3 -c "import sys, json; assets = json.load(sys.stdin)['assets']; names = [a['name'] for a in assets]; print('\n'.join(names))" \
            | grep -q "agentic-workflow-$VERSION.tar.gz"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            | python3 -c "import sys, json; assets = json.load(sys.stdin)['assets']; names = [a['name'] for a in assets]; print('\n'.join(names))" \
            | grep -q "agentic-workflow-$VERSION.zip"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            | python3 -c "import sys, json; assets = json.load(sys.stdin)['assets']; names = [a['name'] for a in assets]; print('\n'.join(names))" \
            | grep -q "SHA256SUMS"

          # Publish the draft
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
